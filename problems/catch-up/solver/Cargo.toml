[package]
name = "catch-up"
version = "0.1.0"
edition = "2024"
default-run = "catch-up"

[dependencies]
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cuda-13030", "dynamic-loading"], optional = true }
rayon = "1"

[features]
# CUDA engine. Off by default; needs the CUDA driver and NVRTC DLLs on PATH at runtime.
cuda = ["dep:cudarc"]
