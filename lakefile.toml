name = "solverz"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CatchUp", "RamseyK3K4eK4e", "SignedDifferenceSets"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false # undeclared names are errors, not silent new variables
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# One lib per problem; Lean files live in problems/<problem>/lean.
[[lean_lib]]
name = "CatchUp"
srcDir = "problems/catch-up/lean"

[[lean_lib]]
name = "RamseyK3K4eK4e"
srcDir = "problems/ramsey-k3-k4e-k4e/lean"

[[lean_lib]]
name = "SignedDifferenceSets"
srcDir = "problems/signed-difference-sets/lean"
